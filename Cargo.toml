[package]
name = "flueny"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
description = "The Flueny client for Claude Code and Grok: derived coding signal only, extracted on this machine"
license = "UNLICENSED"
publish = false

[[bin]]
name = "flueny"
path = "src/main.rs"

[lib]
name = "flueny"
path = "src/lib.rs"

# Every dependency here is paid for on every hook, because a hook of type
# command spawns this binary once per tool call. So: no async runtime, no CLI
# framework, no date library. Each one below earns its place.
[dependencies]
# Blocking HTTP with rustls, so there is no OpenSSL to find on the machine.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# preserve_order is load bearing: the policy bundle's path classifier is first
# match wins in JSON insertion order, and the receipt lists fields in wire order.
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
# repoId is a sha256 of the normalized remote, mirrored from the backend.
sha2 = "0.11"
# Small and lazily compiled. Only the regexes a hook actually touches are built.
regex-lite = "0.1"
gethostname = "1"
# The OS credential store: macOS Keychain, Windows Credential Manager, and the
# Secret Service on Linux (pure Rust D-Bus, so the binary needs no libdbus).
keyring = "4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding stays on: a hook catches a panic and exits 0 rather than aborting
# with a non-zero status the host would show to the developer.
panic = "unwind"
